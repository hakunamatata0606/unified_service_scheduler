version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/V1__create_initial_schema.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false

